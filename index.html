<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightbox <dialog> avec navigation par flèches</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #111827; background: #f8fafc; }
    body { margin: 0; padding: 2rem 1rem; }
    h1 { text-align: center; font-size: 1.4rem; }
    p.aide { text-align: center; color: #475569; margin-top: .25rem; }

    .galerie {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 900px;
      margin: 2rem auto;
    }
    .vignette {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: .5rem;
      cursor: zoom-in;
      display: block;
      transition: transform .15s ease;
    }
    .vignette:hover { transform: scale(1.03); }

    /* --- Lightbox --- */
    dialog#lightbox {
      border: none;
      padding: 0;
      background: transparent;
      max-width: 90vw;
      max-height: 90vh;
    }
    dialog#lightbox::backdrop {
      background: rgba(0, 0, 0, .8);
    }
    .cadre {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #lightbox-img {
      max-width: 85vw;
      max-height: 80vh;
      border-radius: .5rem;
      display: block;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2.75rem;
      height: 2.75rem;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: #fff; }
    #prev { left: -3.25rem; }
    #next { right: -3.25rem; }
    #compteur {
      position: absolute;
      bottom: -2rem;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: .9rem;
      background: rgba(0, 0, 0, .5);
      padding: .25rem .75rem;
      border-radius: 1rem;
    }
  </style>
</head>
<body>
  <h1>Galerie avec lightbox native &lt;dialog&gt;</h1>
  <p class="aide">Cliquez sur une vignette, puis naviguez avec les flèches clavier ← → (ou les boutons). Échap ou clic sur le fond pour fermer.</p>

  <div class="galerie" id="galerie"></div>

  <dialog id="lightbox">
    <div class="cadre">
      <img id="lightbox-img" src="" alt="">
      <button class="nav-btn" id="prev" aria-label="Image précédente">&#8592;</button>
      <button class="nav-btn" id="next" aria-label="Image suivante">&#8594;</button>
      <span id="compteur"></span>
    </div>
  </dialog>

  <script>
    /* Images de démo en SVG inline (data URI) — remplacez par vos propres fichiers. */
    function imgSVG(couleur, num) {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>
        <rect width='800' height='600' fill='${couleur}'/>
        <circle cx='400' cy='300' r='140' fill='rgba(255,255,255,.35)'/>
        <text x='400' y='330' font-size='140' text-anchor='middle' fill='#fff' font-family='sans-serif'>${num}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    const couleurs = ['#0ea5e9', '#f97316', '#22c55e', '#a855f7', '#ef4444', '#eab308', '#14b8a6', '#8b5cf6'];
    const galerie  = document.getElementById('galerie');

    couleurs.forEach((c, i) => {
      const img = document.createElement('img');
      img.className    = 'vignette';
      img.src          = imgSVG(c, i + 1);
      img.dataset.full = imgSVG(c, i + 1); // mettez ici votre image grand format réelle
      img.alt          = `Image de démonstration ${i + 1}`;
      img.loading      = 'lazy';
      galerie.appendChild(img);
    });

    /* --- Lightbox --- */
    const dialog    = document.getElementById('lightbox');
    const imgFull   = document.getElementById('lightbox-img');
    const compteur  = document.getElementById('compteur');
    const vignettes = [...document.querySelectorAll('.vignette')];
    let index = 0;

    function afficher(i) {
      index = (i + vignettes.length) % vignettes.length; // navigation circulaire
      imgFull.src = vignettes[index].dataset.full;
      imgFull.alt = vignettes[index].alt;
      compteur.textContent = (index + 1) + ' / ' + vignettes.length;
    }

    // Ouverture au clic sur une vignette
    vignettes.forEach((v, i) =>
      v.addEventListener('click', () => { afficher(i); dialog.showModal(); })
    );

    // Navigation clavier ← → (Échap ferme déjà nativement)
    dialog.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') afficher(index + 1);
      if (e.key === 'ArrowLeft')  afficher(index - 1);
    });

    // Boutons visibles
    document.getElementById('prev').addEventListener('click', () => afficher(index - 1));
    document.getElementById('next').addEventListener('click', () => afficher(index + 1));

    // Fermeture au clic sur le fond
    dialog.addEventListener('click', (e) => {
      if (e.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
