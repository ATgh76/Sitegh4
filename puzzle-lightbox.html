<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle — version lightbox retouchée</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { background: #e4e4f4; margin: 0; padding: 24px; }
  h1 { font-size: 1.3rem; }
  .titre { color: #900; text-align: center; font-size: clamp(26px, 5vw, 40px); }
  h2 { text-align: center; }
  form { text-align: center; }

  /* ---- Lanceur : centré, plus de décalage en px ---- */
  #lanceur { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .vignette { padding: 0; border: 2px solid #888; background: none; cursor: pointer; }
  .vignette img { display: block; width: 160px; height: 107px; object-fit: cover; }
  @media (max-width: 640px) {
    .vignette img { width: 120px; height: 80px; }
  }

  /* ---- Lightbox : cadrage universel ---- */
  dialog {
    border: none; padding: 0; background: #000;
    max-width: min(96vw, 1600px); max-height: 92dvh;
    margin: auto;            /* centrage garanti, même en cas de débordement */
    overflow: hidden;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .65); }

  /* L'aire de jeu positionne les overlays par rapport à elle */
  #aire { position: relative; line-height: 0; }
  #canvas {
    max-width: 96vw; max-height: 82dvh;   /* dvh : hauteur réelle visible sur mobile */
    border: 1px solid black; cursor: pointer;
    touch-action: none;
  }

  /* Bouton de fermeture (pas de touche Échap sur mobile) */
  #fermer {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(0, 0, 0, .6); color: #fff; border: none;
    font-size: 20px; line-height: 1; padding: 8px 12px; cursor: pointer;
    border-radius: 6px;
  }

  /* Overlays : tailles relatives pour rester proportionnés */
  #txt {
    position: absolute; top: 8px; left: 10px; margin: 0;
    font-size: clamp(14px, 3vw, 24px); line-height: 1.2; padding: 2px 10px;
    background: grey; color: white;
  }
  #miniature {      /* le modèle  */
    position: absolute; right: 8px; bottom: 8px;
    width: 18%; height: auto; aspect-ratio: 3 / 2; object-fit: cover;
    border: 4px solid grey; line-height: 0;
  }
  #pgagne, #pfin {
    position: absolute; left: 0; right: 0; top: 45%; margin: 0;
    font-size: clamp(28px, 8vw, 60px); text-align: center; line-height: 1.1;
    color: coral; text-shadow: 5px 3px 4px #000;
    visibility: hidden;
  }
  #pfin { color: #ff4444; }
</style>
</head>

<body>
  <p class="titre">LANCEMENT D'UN PUZZLE</p>
  <br>
  <h2>1- Sélectionnez une durée</h2>
	<form autocomplete="off">		<!--  formulaire contenant les 8 choix de durée  -->
	  <input type="radio" name="chxdur" onClick="duree=60">    1mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=120">    2mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=180" checked>    3mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=240">    4mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=300">    5mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=360">    6mn &nbsp &nbsp &nbsp
	  <input type="radio" name="chxdur" onClick="duree=420">    7mn &nbsp &nbsp &nbsp
	</form>
  <br>
  <h2>2- Sélectionner le niveau de difficulté</h2>
  <form autocomplete="off">		<!--  formulaire avec les 4 niv de difficulté  -->
	<input type="radio" name="chxdif" onClick="difficulte=3">    niv 3 &nbsp &nbsp &nbsp
	<input type="radio" name="chxdif" onClick="difficulte=4" checked>    niv 4 &nbsp &nbsp &nbsp
	<input type="radio" name="chxdif" onClick="difficulte=5">    niv 5 &nbsp &nbsp &nbsp
	<input type="radio" name="chxdif" onClick="difficulte=6">    niv 6 &nbsp &nbsp &nbsp
  </form>
  <br>
  <h2>3- Sélectionner un puzzle</h2>
  <div id="lanceur">      <!--  communique le numéro de la photo au lanceur  -->
    <button class="vignette" onclick="lancer(1)"><img src="photo1.jpg" alt="Photo 1"></button>
    <button class="vignette" onclick="lancer(2)"><img src="photo2.jpg" alt="Photo 2"></button>
    <button class="vignette" onclick="lancer(3)"><img src="photo3.jpg" alt="Photo 3"></button>
    <button class="vignette" onclick="lancer(4)"><img src="photo4.jpg" alt="Photo 4"></button>
    <button class="vignette" onclick="lancer(5)"><img src="photo5.jpg" alt="Photo 5"></button>
    <button class="vignette" onclick="lancer(6)"><img src="photo6.jpg" alt="Photo 6"></button>
    <button class="vignette" onclick="lancer(7)"><img src="photo7.jpg" alt="Photo 7"></button>
    <button class="vignette" onclick="lancer(8)"><img src="photo8.jpg" alt="Photo 8"></button>
  </div>

<dialog id="lightbox">
  <button id="fermer" onclick="dialog.close()" aria-label="Fermer">&#10005;</button>
  <div id="aire">
    <canvas id="canvas"></canvas>
    <div id="txt"></div>
    <img id="miniature" alt="">
    <p id="pgagne">Partie gagnée</p>
    <p id="pfin">Temps écoulé</p>
  </div>
</dialog>

<script>
/* ================= Références DOM ================= */
var dialog     = document.getElementById('lightbox');
var canvasEl   = document.getElementById('canvas');
var txtEl      = document.getElementById('txt');
var miniEl     = document.getElementById('miniature');
var gagneEl    = document.getElementById('pgagne');
var finEl      = document.getElementById('pfin');

var _stage, _img, _pieces, _puzzleWidth, _puzzleHeight, _pieceWidth, _pieceHeight;
var _currentPiece = null, _currentDropPiece = null, _mouse = {x:0, y:0};
let duree = 180;       // nombre, pas chaîne de caractères
let difficulte = 4;
const PUZZLE_HOVER_TINT = '#009900';

/* ================= Lanceur de la fenêtre puzzle (remplace ex-window.open) ================= */
function lancer(photo) {
  demarrerPuzzle(duree, photo);
  dialog.showModal();
}

/* ================= Paramètres (ex-query string) ================= */
var tpRest = 0;
var timerId = null;
var winId = null;      // timeout d'affichage "Partie gagnée"
var maPhoto = '';

function demarrerPuzzle(duree, photo) {
  reinitialiser();
  tpRest = duree;
  maPhoto = 'photo' + photo + '.jpg';
  miniEl.src = maPhoto;
  /* repli miniature : image de démo si le .jpg est absent */
  if (miniEl.dataset.fallback !== 'ok') {
    miniEl.addEventListener('error', function () {
      if (miniEl.src !== demoURL()) miniEl.src = demoURL();
    });
    miniEl.dataset.fallback = 'ok';
  }

  _img = new Image();
  _img.addEventListener('load', onImage, false);
  /* Repli si l'image est introuvable (démo sans fichiers photo) */
  _img.addEventListener('error', function () {
    _img = creerPhotoDemo();
    onImage();
  });
  _img.src = maPhoto;

  startTime();
}

/* ================= Puzzle (logique inchangée) ================= */
function onImage() {
  _pieceWidth  = Math.floor(_img.width / difficulte);
  _pieceHeight = Math.floor(_img.height / difficulte);
  _puzzleWidth  = _pieceWidth * difficulte;
  _puzzleHeight = _pieceHeight * difficulte;
  canvasEl.width  = _puzzleWidth;
  canvasEl.height = _puzzleHeight;
  _stage = canvasEl.getContext('2d');
  initPuzzle();
}

function initPuzzle() {
  _pieces = [];
  _currentPiece = null;
  _currentDropPiece = null;
  _stage.drawImage(_img, 0, 0, _puzzleWidth, _puzzleHeight, 0, 0, _puzzleWidth, _puzzleHeight);
  createTitle('Cliquer pour mélanger');
  buildPieces();
}

function createTitle(msg) {
  _stage.fillStyle = '#000000';
  _stage.globalAlpha = .4;
  _stage.fillRect(100, _puzzleHeight - 40, _puzzleWidth - 200, 40);
  _stage.fillStyle = '#FFFFFF';
  _stage.globalAlpha = 1;
  _stage.textAlign = 'center';
  _stage.textBaseline = 'middle';
  _stage.font = '20px Arial';
  _stage.fillText(msg, _puzzleWidth / 2, _puzzleHeight - 20);
}

function buildPieces() {
  var piece, xPos = 0, yPos = 0;
  for (var i = 0; i < difficulte * difficulte; i++) {
    piece = { sx: xPos, sy: yPos, xPos: 0, yPos: 0 };
    _pieces.push(piece);
    xPos += _pieceWidth;
    if (xPos >= _puzzleWidth) { xPos = 0; yPos += _pieceHeight; }
  }
  /* appui (souris ou doigt) -> mélange */
  canvasEl.addEventListener('pointerdown', shufflePuzzle);
}

function shufflePuzzle() {
  canvasEl.removeEventListener('pointerdown', shufflePuzzle);
  _pieces = shuffleArray(_pieces);
  _stage.clearRect(0, 0, _puzzleWidth, _puzzleHeight);
  var piece, xPos = 0, yPos = 0;
  for (var i = 0; i < _pieces.length; i++) {
    piece = _pieces[i];
    piece.xPos = xPos; piece.yPos = yPos;
    _stage.drawImage(_img, piece.sx, piece.sy, _pieceWidth, _pieceHeight, xPos, yPos, _pieceWidth, _pieceHeight);
    _stage.strokeRect(xPos, yPos, _pieceWidth, _pieceHeight);
    xPos += _pieceWidth;
    if (xPos >= _puzzleWidth) { xPos = 0; yPos += _pieceHeight; }
  }
  /* appui -> prise de pièce */
  canvasEl.addEventListener('pointerdown', onPuzzleClick);
}

function onPuzzleClick(e) {
  majSouris(e);
  _currentPiece = checkPieceClicked();
  if (_currentPiece != null) {
    _stage.clearRect(_currentPiece.xPos, _currentPiece.yPos, _pieceWidth, _pieceHeight);
    _stage.save();
    _stage.globalAlpha = .9;
    _stage.drawImage(_img, _currentPiece.sx, _currentPiece.sy, _pieceWidth, _pieceHeight,
                     _mouse.x - _pieceWidth / 2, _mouse.y - _pieceHeight / 2, _pieceWidth, _pieceHeight);
    _stage.restore();
    /* pendant le glissé, on suit document (relâchement possible hors canvas) */
    document.addEventListener('pointermove', updatePuzzle);
    document.addEventListener('pointerup', pieceDropped);
  }
}

/* Coordonnées pointeur -> coordonnées internes du canvas
   (gère la mise à l'échelle CSS du canvas) */
function majSouris(e) {
  var r = canvasEl.getBoundingClientRect();
  _mouse.x = (e.clientX - r.left) * (canvasEl.width / r.width);
  _mouse.y = (e.clientY - r.top) * (canvasEl.height / r.height);
}

function checkPieceClicked() {
  for (var i = 0; i < _pieces.length; i++) {
    var piece = _pieces[i];
    if (_mouse.x < piece.xPos || _mouse.x > (piece.xPos + _pieceWidth) ||
        _mouse.y < piece.yPos || _mouse.y > (piece.yPos + _pieceHeight)) {
      /* pièce non atteinte */
    } else {
      return piece;
    }
  }
  return null;
}

function updatePuzzle(e) {
  majSouris(e);
  _currentDropPiece = null;
  _stage.clearRect(0, 0, _puzzleWidth, _puzzleHeight);
  for (var i = 0; i < _pieces.length; i++) {
    var piece = _pieces[i];
    if (piece == _currentPiece) continue;
    _stage.drawImage(_img, piece.sx, piece.sy, _pieceWidth, _pieceHeight, piece.xPos, piece.yPos, _pieceWidth, _pieceHeight);
    _stage.strokeRect(piece.xPos, piece.yPos, _pieceWidth, _pieceHeight);
    if (_currentDropPiece == null) {
      if (_mouse.x < piece.xPos || _mouse.x > (piece.xPos + _pieceWidth) ||
          _mouse.y < piece.yPos || _mouse.y > (piece.yPos + _pieceHeight)) {
        /* pointeur pas au-dessus */
      } else {
        _currentDropPiece = piece;
        _stage.save();
        _stage.globalAlpha = .4;
        _stage.fillStyle = PUZZLE_HOVER_TINT;
        _stage.fillRect(_currentDropPiece.xPos, _currentDropPiece.yPos, _pieceWidth, _pieceHeight);
        _stage.restore();
      }
    }
  }
  _stage.save();
  _stage.globalAlpha = .6;
  _stage.drawImage(_img, _currentPiece.sx, _currentPiece.sy, _pieceWidth, _pieceHeight,
                  _mouse.x - _pieceWidth / 2, _mouse.y - _pieceHeight / 2, _pieceWidth, _pieceHeight);
  _stage.restore();
  _stage.strokeRect(_mouse.x - _pieceWidth / 2, _mouse.y - _pieceHeight / 2, _pieceWidth, _pieceHeight);
}

function pieceDropped() {
  document.removeEventListener('pointermove', updatePuzzle);
  document.removeEventListener('pointerup', pieceDropped);
  if (_currentDropPiece != null) {
    var tmp = { xPos: _currentPiece.xPos, yPos: _currentPiece.yPos };
    _currentPiece.xPos = _currentDropPiece.xPos;
    _currentPiece.yPos = _currentDropPiece.yPos;
    _currentDropPiece.xPos = tmp.xPos;
    _currentDropPiece.yPos = tmp.yPos;
  }
  resetPuzzleAndCheckWin();
}

function resetPuzzleAndCheckWin() {
  _stage.clearRect(0, 0, _puzzleWidth, _puzzleHeight);
  var gameWin = true;
  for (var i = 0; i < _pieces.length; i++) {
    var piece = _pieces[i];
    _stage.drawImage(_img, piece.sx, piece.sy, _pieceWidth, _pieceHeight, piece.xPos, piece.yPos, _pieceWidth, _pieceHeight);
    _stage.strokeRect(piece.xPos, piece.yPos, _pieceWidth, _pieceHeight);
    if (piece.xPos != piece.sx || piece.yPos != piece.sy) gameWin = false;
  }
  if (gameWin) {
    gagneEl.style.visibility = 'visible';
    winId = setTimeout(function () {     // stocké pour nettoyage à la fermeture
      gagneEl.style.visibility = 'hidden';
      winId = null;
      gameOver();
    }, 1500);
  }
}

function gameOver() {
  canvasEl.removeEventListener('pointerdown', onPuzzleClick);
  document.removeEventListener('pointermove', updatePuzzle);
  document.removeEventListener('pointerup', pieceDropped);
  initPuzzle(); /* nouvelle partie */
}

function shuffleArray(o) {
  for (var j, x, i = o.length; i; j = parseInt(Math.random() * i), x = o[--i], o[i] = o[j], o[j] = x);
  return o;
}

/* ================= Timer (nettoyage intégré) ================= */
function startTime() {
  txtEl.innerHTML = Math.floor(tpRest / 60) + ':' + ('0' + tpRest % 60).slice(-2);  /* affichage mn:ss */
  timerId = setTimeout(controlTime, 1000);
  tpRest--;
  if (tpRest == -1) {
    finEl.style.visibility = 'visible';
    canvasEl.removeEventListener('pointerdown', shufflePuzzle);
    canvasEl.removeEventListener('pointerdown', onPuzzleClick);
    document.removeEventListener('pointermove', updatePuzzle);
    document.removeEventListener('pointerup', pieceDropped);
    setTimeout(function () { finEl.style.visibility = 'hidden'; }, 2500);
  }
}
function controlTime() {
  if (tpRest != -1 && dialog.open) startTime();
}

/* ================= Nettoyage à la fermeture ================= */
function reinitialiser() {
  clearTimeout(timerId);
  clearTimeout(winId);
  timerId = null;
  winId = null;
  canvasEl.removeEventListener('pointerdown', shufflePuzzle);
  canvasEl.removeEventListener('pointerdown', onPuzzleClick);
  document.removeEventListener('pointermove', updatePuzzle);
  document.removeEventListener('pointerup', pieceDropped);
  gagneEl.style.visibility = 'hidden';
  finEl.style.visibility = 'hidden';
}

dialog.addEventListener('close', reinitialiser);

/* Fermeture au clic sur le fond (::backdrop) */
dialog.addEventListener('click', function (e) {
  if (e.target === dialog) dialog.close();
});

/* ================= Photo de démonstration (si .jpg absent) ================= */
var _demoURL = null;
function demoURL() {
  if (_demoURL) return _demoURL;
  _demoURL = demoCanvas().toDataURL();
  return _demoURL;
}
function demoCanvas() {
  var c = document.createElement('canvas');
  c.width = 1200; c.height = 800;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 1200, 800);
  grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#7c3aed');
  g.fillStyle = grad; g.fillRect(0, 0, 1200, 800);
  var cols = ['#f59e0b', '#10b981', '#ef4444', '#f472b6', '#fff'];
  for (var i = 0; i < 40; i++) {
    g.fillStyle = cols[i % cols.length];
    g.beginPath();
    g.arc(Math.random() * 1200, Math.random() * 800, 20 + Math.random() * 90, 0, 7);
    g.fill();
  }
  g.fillStyle = '#fff'; g.font = 'bold 90px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('DEMO', 600, 400);
  return c;
}
function creerPhotoDemo() { return demoCanvas(); }

/* Repli des vignettes du lanceur si le .jpg est absent */
document.querySelectorAll('#lanceur img').forEach(function (img) {
  img.addEventListener('error', function () {
    if (img.src !== demoURL()) img.src = demoURL();
  });
});
</script>
</body>
</html>
